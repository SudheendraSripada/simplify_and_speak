<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5856d6" />
      <stop offset="100%" stop-color="#af52de" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#grad)" />
  
  <!-- Outer Glow Sparkle -->
  <path d="M64,24 L68,44 L88,48 L68,52 L64,72 L60,52 L40,48 L60,44 Z" fill="#ffffff" opacity="0.9" filter="url(#glow)" transform="translate(16, -8) scale(0.7)" />
  
  <!-- Speaker Icon -->
  <path d="M42,48 L54,48 L68,34 L68,94 L54,80 L42,80 Z" fill="#ffffff" />
  
  <!-- Sound Waves -->
  <path d="M78,48 C83,54 83,74 78,80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M88,38 C97,48 97,80 88,90" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M98,28 C111,40 111,88 98,100" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4" />
</svg>
